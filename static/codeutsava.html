<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CODEUTSAVA 10</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #3a6ea5;
    font-family: Tahoma, Verdana, "MS Sans Serif", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* XP window frame — gradients lifted from src/app.css */
  .dialog {
    width: 460px;
    display: flex;
    flex-direction: column;
    border-radius: 8px 8px 0 0;
    box-shadow:
      inset -1px -1px #424fa2, inset 1px 1px #4e68d1,
      inset -2px -2px #5669c0, inset 2px 2px #528eef,
      inset -3px -3px #4e73d7, inset 3px 3px #5284da,
      2px 4px 10px rgba(0, 0, 0, 0.35);
    background: #0053ee;
    padding: 3px;
    padding-top: 0;
  }

  .titlebar {
    height: 28px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1px 2px 1px 6px;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(
      180deg, #0997ff, #0053ee 8%, #0050ee 40%,
      #06f 88%, #06f 93%, #005bff 95%, #003dd7 96%, #003dd7
    );
  }

  .titlebar p {
    margin: 0;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.45);
  }

  /* close button drawn in CSS so the file works over file:// too */
  .close-btn {
    width: 21px;
    height: 21px;
    padding: 0;
    cursor: pointer;
    position: relative;
    border: 1px solid #ffffff;
    border-radius: 3px;
    background: linear-gradient(180deg, #f37f6c, #e0492e 45%, #d33c22 55%, #ba2f1a);
  }

  .close-btn:hover { filter: brightness(1.12); }
  .close-btn:active { filter: brightness(0.9); }

  .close-btn::before,
  .close-btn::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 11px;
    height: 2px;
    background: #ffffff;
  }

  .close-btn::before { transform: translate(-50%, -50%) rotate(45deg); }
  .close-btn::after  { transform: translate(-50%, -50%) rotate(-45deg); }

  .body {
    background: #ece9d8;
    border: 2px solid #0053ee;
    border-top: 0;
    padding: 0;
  }

  .content {
    text-align: center;
    padding: 34px 40px 26px 40px;
  }

  .welcome {
    font-size: 16px;
    font-weight: normal;
    margin: 0 0 10px 0;
    color: #000000;
    letter-spacing: 1px;
  }

  h1 {
    font-size: 30px;
    font-weight: bold;
    margin: 0 0 18px 0;
    color: #000000;
    line-height: 1.3;
  }

  h2 {
    font-size: 24px;
    font-weight: 900;
    margin: 0 0 14px 0;
    color: #000000;
    letter-spacing: 2px;
  }

  .tagline {
    font-size: 15px;
    font-weight: normal;
    margin: 0;
    color: #000000;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .buttons {
    display: flex;
    justify-content: flex-end;
    padding: 0 14px 14px 14px;
  }

  /* XP push button */
  .btn {
    min-width: 75px;
    height: 23px;
    padding: 0 12px;
    font-family: inherit;
    font-size: 11px;
    color: #000000;
    cursor: pointer;
    border: 1px solid #003c74;
    border-radius: 3px;
    background: linear-gradient(180deg, #fdfdfd, #f2f1ea 45%, #e6e4d5 50%, #f4f3ee);
    box-shadow: inset 0 0 0 1px #ffffff;
  }

  .btn:hover { border-color: #e9a900; }
  .btn:active { background: linear-gradient(180deg, #e0dfd4, #eceade); }
  .btn:focus { outline: 1px dotted #000000; outline-offset: -4px; }
</style>
</head>
<body>

  <div class="dialog" role="dialog" aria-labelledby="dlg-title">
    <div class="titlebar">
      <p id="dlg-title">CODEUTSAVA 10</p>
      <button class="close-btn" aria-label="Close" onclick="window.close()"></button>
    </div>

    <div class="body">
      <div class="content">
        <p class="welcome">Welcome to</p>
        <h1>Central India's Largest Hackathon</h1>
        <h2>CODEUTSAVA 10</h2>
        <p class="tagline">Code . Innovate . Celebrate</p>
      </div>

      <div class="buttons">
        <button class="btn" autofocus onclick="window.close()">OK</button>
      </div>
    </div>
  </div>

</body>
</html>
